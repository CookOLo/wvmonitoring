<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #F5F5F5;
      color: #000;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #8C1D40;
      margin-bottom: 10px;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      padding: 25px;
      border-top: 6px solid #8C1D40;
      text-align: center;
    }

    p {
      font-size: 12pt;
      margin: 10px 0;
    }

    .home-btn {
      background-color: #8C1D40;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12pt;
      display: inline-block;
      margin-top: 20px;
      transition: background-color 0.3s ease;
      text-decoration: none;
    }

    .home-btn:hover {
      background-color: #6e1633;
    }

  </style>
</head>

<body>

  <h1>Page Not Found</h1>

  <div class="container">
    <p>The requested page was not found.</p>

    <a href="index.html" class="home-btn">Return Home</a>
  </div>

</body>
</html>
